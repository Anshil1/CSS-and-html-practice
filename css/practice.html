<!DOCTYPE html>
<html lang="en">
<head>
  <title>practice</title>
  <style>
   .progress_status{
      height:20px;
      width: 90%;
      border: 2px solid black;
      border-radius: 20px;
      background-color: beige;
      position: absolute;
      left: 4%;

   }
   .progress_bar{
      background-color: blueviolet;
      /* width: 50%; */
      height: 100%;
      border-radius: 20px;
      animation: anshil 2s ease-in-out 3s infinite normal;

   }
   @keyframes anshil{
   0%{width:0%;}
   50%{width:90%;}
   60%{width:92%;}
   70%{width:94%;}
   80%{width:96%;}
   90%{width:98%;}
   100%{width:100%;}
  }
  .loading{
   display: flex;
   justify-content: center;
  }
  
  </style>
  

</head>
<body>
   <h1 class="loading">Loading...</h1>
   <div class="progress_status">
      <div class="progress_bar">

      </div>

   </div>
</body>
</html>
